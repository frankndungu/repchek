<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>
      morgan - Muscle Optimization and Recovery Guidance Analysis Network
    </title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <video id="camera" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      <div id="hud" hidden></div>
      <div id="counter" hidden></div>
      <div id="exercise" hidden></div>
      <div id="debug"></div>
      <div id="start-screen">
        <h1>M.O.R.G.A.N.</h1>
        <p>Muscle Optimization and Recovery Guidance Analysis Network</p>
        <label for="exercise-select">Exercise</label>
        <select id="exercise-select"></select>
        <p id="camera-hint"></p>
        <div class="targets">
          <label
            >Sets
            <input id="sets-input" type="number" min="1" max="10" value="4"
          /></label>
          <label
            >Reps
            <input id="reps-input" type="number" min="1" max="50" value="12"
          /></label>
        </div>
        <button id="start-btn">Start Camera</button>
        <p id="status"></p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
